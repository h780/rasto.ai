<!DOCTYPE html>

<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>rasto.ai — Coming Soon</title>
	<style>
	  * { margin: 0; padding: 0; box-sizing: border-box; }
	  body {
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		background: #0a0a0a;
		color: #fff;
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		text-align: center;
		padding: 2rem;
	  }
	  .dots {
		display: flex;
		gap: 8px;
		margin: 0 auto 2rem;
		justify-content: center;
	  }
	  .dots span {
		width: 10px; height: 10px;
		background: #f97316;
		border-radius: 50%;
		animation: pulse 1.2s infinite;
	  }
	  .dots span:nth-child(2) { animation-delay: 0.2s; }
	  .dots span:nth-child(3) { animation-delay: 0.4s; }
	  @keyframes pulse {
		0%, 100% { opacity: 0.2; transform: scale(1); }
		50% { opacity: 1; transform: scale(1.4); }
	  }
	  h1 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.02em; }
	  h1 span { color: #f97316; }
	  p { margin-top: 1rem; color: #888; font-size: 1.1rem; }
	  .badge {
		margin-top: 2.5rem;
		display: inline-block;
		padding: 0.4rem 1rem;
		border: 1px solid #333;
		border-radius: 999px;
		font-size: 0.8rem;
		color: #555;
		letter-spacing: 0.1em;
		text-transform: uppercase;
	  }
	  footer {
		position: fixed;
		bottom: 0;
		left: 0;
		right: 0;
		padding: 1rem;
		text-align: center;
		font-size: 0.85rem;
		color: #444;
		border-top: 1px solid #1a1a1a;
		background: #0a0a0a;
	  }
	  footer a {
		color: #f97316;
		text-decoration: none;
	  }
	  footer a:hover { text-decoration: underline; }
	</style>
</head>

<body>
  <div class="dots"><span></span><span></span><span></span></div>
  
  <h1>rasto<span>.ai</span></h1>
  
  <p>Something great is on its way...</p>
  
  <div class="badge">Under Construction</div>

  <footer>
    <a href="mailto:info@rasto.ai">info@rasto.ai</a>
  </footer>

</body>

</html>
